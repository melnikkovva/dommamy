services:
  db:
    image: mysql:8
    command: --bind-address=127.0.0.1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: fund
      MYSQL_USER: fund
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./migrations/add_learn.sql:/docker-entrypoint-initdb.d/002_add_learn.sql
      - ./migrations/add_photo_url.sql:/docker-entrypoint-initdb.d/003_add_photo_url.sql
      - ./migrations/add_user.sql:/docker-entrypoint-initdb.d/004_add_user.sql
      - ./migrations/seed_admin.sql:/docker-entrypoint-initdb.d/005_seed_admin.sql
      - ./migrations/add_mom_role.sql:/docker-entrypoint-initdb.d/006_add_mom_role.sql
      - ./migrations/add_mother_learn_link.sql:/docker-entrypoint-initdb.d/007_add_mother_learn_link.sql
      - ./migrations/add_soft_delete.sql:/docker-entrypoint-initdb.d/008_add_soft_delete.sql
      - ./migrations/add_ipr.sql:/docker-entrypoint-initdb.d/009_add_ipr.sql
      - ./migrations/add_consultation.sql:/docker-entrypoint-initdb.d/010_add_consultation.sql
      - ./migrations/add_problem_type.sql:/docker-entrypoint-initdb.d/011_add_problem_type.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
    network_mode: host

  backend:
    build: ./backend
    restart: on-failure
    environment:
      HTTP_ADDR: 127.0.0.1:8080
      DATABASE_URL: fund:${DB_PASSWORD}@tcp(127.0.0.1:3306)/fund?parseTime=true&charset=utf8mb4
      FILES_DIR: /app/uploads
      AUTH_SECRET: ${AUTH_SECRET}
      LEARN_API_BASE_URL: ${LEARN_API_BASE_URL}
      LEARN_API_CLIENT_ID: ${LEARN_API_CLIENT_ID}
      LEARN_API_CLIENT_SECRET: ${LEARN_API_CLIENT_SECRET}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    network_mode: host

  frontend:
    build: ./frontend
    restart: on-failure
    depends_on:
      - backend
    network_mode: host

volumes:
  dbdata:
  uploads: